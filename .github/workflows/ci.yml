name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  migraciones:
    # Aplica migraciones + seed en un Postgres limpio para detectar SQL roto
    # antes de que llegue a Supabase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Misma versión que package-lock.json para que el generador sea reproducible.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase db start
      - run: supabase db reset --local
      - run: node scripts/tipos-db.mjs --check
      # Las comprobaciones de supabase/pruebas/: permisos, reglas del juego,
      # orden, desempates y marcador. Cada una se probó en los dos sentidos
      # (falla sin el arreglo, pasa con el arreglo), así que si una se pone
      # roja acá es que una migración volvió a abrir un agujero.
      - run: node scripts/pruebas-sql.mjs
